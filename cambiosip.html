<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cambios IP - ImpresorasMonitor</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    color:#333;
}

nav{
    margin-bottom:20px;
}

nav a{
    text-decoration:none;
    color:#1976d2;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,.10);
}

.valor{
    font-size:30px;
    font-weight:bold;
    margin-top:10px;
    color:#0d6efd;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1976d2;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tr:hover{
    background:#f5f5f5;
}

</style>

</head>

<body>

<nav>

<a href="index.html">🏠 Dashboard</a>
|
<a href="eventos.html">🔔 Eventos</a>

</nav>

<h1>🔄 Cambios de IP</h1>

<div class="cards">

    <div class="card">
        <div>🔄 Cambios IP</div>
        <div id="totalCambios" class="valor">0</div>
    </div>

    <div class="card">
        <div>🖨️ Equipos afectados</div>
        <div id="equiposUnicos" class="valor">0</div>
    </div>

    <div class="card">
        <div>📋 Registros</div>
        <div id="totalRegistros" class="valor">0</div>
    </div>

</div>

<input
    id="busqueda"
    type="text"
    placeholder="Buscar equipo, serial o detalle..."
>

<table>

<thead>

<tr>
    <th>Fecha</th>
    <th>Equipo</th>
    <th>Serial</th>
    <th>Detalle</th>
</tr>

</thead>

<tbody id="tablaCambios">
</tbody>

</table>

<script>

let eventos = [];

function render(filtro = ""){

    const tabla =
        document.getElementById(
            "tablaCambios"
        );

    tabla.innerHTML = "";

    eventos

    .filter(
        e =>
        e.tipo === "cambio_ip"
    )

    .filter(e => {

        const texto = (

            (e.equipo || "")
            + " " +
            (e.serial || "")
            + " " +
            (e.detalle || "")

        ).toLowerCase();

        return texto.includes(
            filtro.toLowerCase()
        );

    })

    .sort(
        (a,b) =>
        new Date(b.fecha)
        -
        new Date(a.fecha)
    )

    .forEach(e => {

        tabla.innerHTML += `

        <tr>

            <td>
                ${
                    new Date(
                        e.fecha
                    ).toLocaleString(
                        "es-CL"
                    )
                }
            </td>

            <td>
                ${e.equipo ?? "-"}
            </td>

            <td>
                ${e.serial ?? "-"}
            </td>

            <td>
                ${e.detalle ?? "-"}
            </td>

        </tr>

        `;

    });

}

fetch("eventos.json")

.then(r => r.json())

.then(data => {

    eventos = data;

    const cambios = eventos.filter(
        e =>
        e.tipo === "cambio_ip"
    );

    const equipos = new Set(

        cambios.map(
            e => e.serial
        )

    );

    document.getElementById(
        "totalCambios"
    ).textContent =
        cambios.length;

    document.getElementById(
        "equiposUnicos"
    ).textContent =
        equipos.size;

    document.getElementById(
        "totalRegistros"
    ).textContent =
        cambios.length;

    render();

    document
        .getElementById(
            "busqueda"
        )
        .addEventListener(
            "keyup",
            e => render(
                e.target.value
            )
        );

});

</script>

</body>

</html>
