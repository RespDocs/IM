<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Conectividad - ImpresorasMonitor</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    color:#333;
}

nav{
    margin-bottom:20px;
}

nav a{
    text-decoration:none;
    color:#1976d2;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,.10);
}

.valor{
    font-size:30px;
    font-weight:bold;
    margin-top:10px;
}

.offline{
    color:#dc3545;
}

.online{
    color:#198754;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1976d2;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tr:hover{
    background:#f5f5f5;
}

</style>

</head>

<body>

<nav>

<a href="index.html">🏠 Dashboard</a>
|
os.html">🔔 Eventos</a>

</nav>

<h1>🌐 Conectividad</h1>

<div class="cards">

    <div class="card">
        <div>⚫ Offline</div>
        <div id="totalOffline" class="valor offline">0</div>
    </div>

    <div class="card">
        <div>🟢 Recuperados</div>
        <div id="totalOnline" class="valor online">0</div>
    </div>

    <div class="card">
        <div>🖨️ Equipos</div>
        <div id="equiposUnicos" class="valor">0</div>
    </div>

    <div class="card">
        <div>📋 Eventos</div>
        <div id="totalEventos" class="valor">0</div>
    </div>

</div>

<input
    id="busqueda"
    type="text"
    placeholder="Buscar equipo, serial o detalle..."
>

<table>

<thead>
<tr>
    <th>Fecha</th>
    <th>Estado</th>
    <th>Equipo</th>
    <th>Serial</th>
    <th>Detalle</th>
</tr>
</thead>

<tbody id="tabla">
</tbody>

</table>

<script>

let eventos = [];

function render(filtro=""){

    const tabla =
        document.getElementById(
            "tabla"
        );

    tabla.innerHTML = "";

    eventos

    .filter(e =>

        e.tipo === "offline"
        ||
        e.tipo === "online"

    )

    .filter(e => {

        const texto = (

            (e.equipo || "")
            + " " +
            (e.serial || "")
            + " " +
            (e.detalle || "")

        ).toLowerCase();

        return texto.includes(
            filtro.toLowerCase()
        );

    })

    .sort(

        (a,b) =>

        new Date(b.fecha)
        -
        new Date(a.fecha)

    )

    .forEach(e => {

        const icono =
            e.tipo === "offline"
            ? "⚫"
            : "🟢";

        const estado =
            e.tipo === "offline"
            ? "Offline"
            : "Recuperado";

        tabla.innerHTML += `

        <tr>

            <td>
                ${
                    new Date(
                        e.fecha
                    ).toLocaleString(
                        "es-CL"
                    )
                }
            </td>

            <td>
                ${icono}
                ${estado}
            </td>

            <td>
                ${e.equipo ?? "-"}
            </td>

            <td>
                ${e.serial ?? "-"}
            </td>

            <td>
                ${e.detalle ?? "-"}
            </td>

        </tr>

        `;

    });

}

fetch("eventos.json")

.then(r => r.json())

.then(data => {

    eventos = data;

    const offline =
        eventos.filter(
            e => e.tipo === "offline"
        );

    const online =
        eventos.filter(
            e => e.tipo === "online"
        );

    const equipos =
        new Set(
            eventos
            .filter(
                e =>
                e.tipo === "offline"
                ||
                e.tipo === "online"
            )
            .map(
                e => e.serial
            )
        );

    document.getElementById(
        "totalOffline"
    ).textContent =
        offline.length;

    document.getElementById(
        "totalOnline"
    ).textContent =
        online.length;

    document.getElementById(
        "equiposUnicos"
    ).textContent =
        equipos.size;

    document.getElementById(
        "totalEventos"
    ).textContent =
        offline.length
        +
        online.length;

    render();

    document
        .getElementById(
            "busqueda"
        )
        .addEventListener(
            "keyup",
            e => render(
                e.target.value
            )
        );

});

</script>

</body>
</html>
