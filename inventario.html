<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Inventario - ImpresorasMonitor</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    color:#333;
}

nav{
    margin-bottom:20px;
}

nav a{
    text-decoration:none;
    color:#1976d2;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1976d2;
    color:white;
    padding:10px;
    text-align:center;
    cursor:pointer;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tr:hover{
    background:#f5f5f5;
}

th:hover{
    background:#1565c0;
}

</style>

</head>

<body>

<nav>
    <a href="index.html">🏠 Dashboard</a>
    |
    <a href="alertas.html">🚨 Alertas</a>
</nav>

<h1>🖨️ Inventario de Impresoras</h1>

<input
    id="busqueda"
    type="text"
    placeholder="Buscar nombre, serie, modelo o IP..."
>

<table>

<thead>

<tr>

    <th>
    #
    </th>

    <th onclick="ordenarPor('nombre')">
        Nombre ▲▼
    </th>

    <th onclick="ordenarPor('serial')">
        Serie ▲▼
    </th>

    <th onclick="ordenarPor('modelo')">
        Modelo ▲▼
    </th>

    <th onclick="ordenarPor('ip')">
        IP ▲▼
    </th>

    <th onclick="ordenarPor('contador')">
        Contador ▲▼
    </th>

    <th onclick="ordenarPor('online')">
        Estado ▲▼
    </th>

    <th onclick="ordenarPor('ultima_lectura')">
        Última lectura ▲▼
    </th>

</tr>

</thead>

<tbody id="tablaImpresoras">
</tbody>

</table>

<script>

let impresoras = [];

let columnaOrden = "nombre";

let ascendente = true;

function ordenarPor(columna){

    if(columnaOrden === columna){

        ascendente = !ascendente;

    }
    else{

        columnaOrden = columna;

        ascendente = true;

    }

    renderTabla(
        document.getElementById(
            "busqueda"
        ).value
    );

}

function renderTabla(
    filtro = ""
){

    const tabla =
        document.getElementById(
            "tablaImpresoras"
        );

    tabla.innerHTML = "";

    impresoras

        .filter(i => {

            const texto = (

                (i.nombre || "")
                + " "
                + (i.serial || "")
                + " "
                + (i.modelo || "")
                + " "
                + (i.ip || "")

            ).toLowerCase();

            return texto.includes(
                filtro.toLowerCase()
            );

        })

        .sort((a,b) => {

            let resultado = 0;

            if(
                columnaOrden === "contador"
            ){

                resultado =
                    (a.contador || 0)
                    -
                    (b.contador || 0);

            }

            else if(
                columnaOrden === "online"
            ){

                resultado =
                    Number(a.online)
                    -
                    Number(b.online);

            }

            else if(
                columnaOrden ===
                "ultima_lectura"
            ){

                resultado =
                    new Date(
                        a.ultima_lectura || 0
                    )
                    -
                    new Date(
                        b.ultima_lectura || 0
                    );

            }

            else if(
                columnaOrden === "ip"
            ){

                const ipa =
                    (a.ip || "0.0.0.0")
                    .split(".")
                    .map(Number);

                const ipb =
                    (b.ip || "0.0.0.0")
                    .split(".")
                    .map(Number);

                for(
                    let i = 0;
                    i < 4;
                    i++
                ){

                    if(
                        ipa[i] !== ipb[i]
                    ){

                        resultado =
                            ipa[i] - ipb[i];

                        break;

                    }

                }

            }

            else{

                resultado =

                    String(
                        a[columnaOrden] || ""
                    )

                    .localeCompare(

                        String(
                            b[columnaOrden] || ""
                        )

                    );

            }

            return ascendente
                ? resultado
                : -resultado;

        })

        .forEach(i, index => {

            const ultima =
                i.ultima_lectura
                ? new Date(
                    i.ultima_lectura
                ).toLocaleString(
                    "es-CL"
                )
                : "-";

            tabla.innerHTML += `

            <tr>

                <td>
                ${index + 1}
                </td>

                <td>
                    ${i.nombre ?? "-"}
                </td>

                <td>
                    ${i.serial ?? "-"}
                </td>

                <td>
                    ${i.modelo ?? "-"}
                </td>

                <td>
                    ${i.ip ?? "-"}
                </td>

                <td>
                    ${i.contador ?? "-"}
                </td>

                <td>
                    ${
                        i.online
                        ? "🟢"
                        : "🔴"
                    }
                </td>

                <td>
                    ${ultima}
                </td>

            </tr>

            `;

        });

}

fetch("dashboard.json")

.then(r => r.json())

.then(data => {

    impresoras =
        data.impresoras;

    renderTabla();

    document

        .getElementById(
            "busqueda"
        )

        .addEventListener(
            "keyup",
            e => {

                renderTabla(
                    e.target.value
                );

            }
        );

});

</script>

</body>

</html>
