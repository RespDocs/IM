<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Inventario - ImpresorasMonitor</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    color:#333;
}

nav{
    margin-bottom:20px;
}

nav a{
    text-decoration:none;
    color:#1976d2;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:15px;
}

select{
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1976d2;
    color:white;
    padding:10px;
    text-align:center;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tr:hover{
    background:#f5f5f5;
}

</style>

</head>

<body>

<nav>
    <a href="index.html">🏠 Dashboard</a>
    |
    <a href="alertas.html">🚨 Alertas</a>
</nav>

<h1>🖨️ Inventario de Impresoras</h1>

<input
    id="busqueda"
    type="text"
    placeholder="Buscar nombre, serie, modelo o IP..."
>

<br>

<select id="orden">

    <option value="nombre">
        Ordenar por Nombre
    </option>

    <option value="ip">
        Ordenar por IP
    </option>

    <option value="modelo">
        Ordenar por Modelo
    </option>

    <option value="serial">
        Ordenar por Serie
    </option>

    <option value="contador">
        Ordenar por Contador
    </option>

</select>

<table>

<thead>

<tr>
    <th>Serie</th>
    <th>Modelo</th>
    <th>IP</th>
    <th>Contador</th>
    <th>Estado</th>
    <th>Última lectura</th>
    <th>Nombre</th>
</tr>

</thead>

<tbody id="tablaImpresoras"></tbody>

</table>

<script>

fetch("dashboard.json")

.then(r => r.json())

.then(data => {

    const impresoras =
        data.impresoras;

    const tabla =
        document.getElementById(
            "tablaImpresoras"
        );

    function renderTabla(
        filtro = ""
    ){

        tabla.innerHTML = "";

        const orden =
            document
            .getElementById(
                "orden"
            )
            .value;

        impresoras

            .filter(i => {

                const texto = (

                    (i.nombre || "")
                    + " "
                    + (i.serial || "")
                    + " "
                    + (i.modelo || "")
                    + " "
                    + (i.ip || "")

                ).toLowerCase();

                return texto.includes(
                    filtro.toLowerCase()
                );

            })

            .sort((a,b) => {

                if(
                    orden === "nombre"
                ){

                    return (
                        a.nombre || ""
                    ).localeCompare(
                        b.nombre || ""
                    );

                }

                if(
                    orden === "ip"
                ){

                    return (
                        a.ip || ""
                    ).localeCompare(
                        b.ip || ""
                    );

                }

                if(
                    orden === "modelo"
                ){

                    return (
                        a.modelo || ""
                    ).localeCompare(
                        b.modelo || ""
                    );

                }

                if(
                    orden === "serial"
                ){

                    return (
                        a.serial || ""
                    ).localeCompare(
                        b.serial || ""
                    );

                }

                if(
                    orden === "contador"
                ){

                    return (
                        b.contador || 0
                    ) - (
                        a.contador || 0
                    );

                }

                return 0;

            })

            .forEach(i => {

                const ultima =
                    i.ultima_lectura
                    ? new Date(
                        i.ultima_lectura
                    ).toLocaleString(
                        "es-CL"
                    )
                    : "-";

                tabla.innerHTML += `

                <tr>
                
                    <td>
                        ${i.serial ?? "-"}
                    </td>

                    <td>
                        ${i.modelo ?? "-"}
                    </td>

                    <td>
                        ${i.ip ?? "-"}
                    </td>

                    <td>
                        ${i.contador ?? "-"}
                    </td>

                    <td>
                        ${
                            i.online
                            ? "🟢"
                            : "🔴"
                        }
                    </td>

                    <td>
                        ${ultima}
                    </td>

                    <td>
                        ${i.nombre ?? "-"}
                    </td>


                </tr>

                `;

            });

    }

    renderTabla();

    document
        .getElementById(
            "busqueda"
        )
        .addEventListener(
            "keyup",
            e => {

                renderTabla(
                    e.target.value
                );

            }
        );

    document
        .getElementById(
            "orden"
        )
        .addEventListener(
            "change",
            () => {

                renderTabla(
                    document
                    .getElementById(
                        "busqueda"
                    )
                    .value
                );

            }
        );

});

</script>

</body>

</html>
