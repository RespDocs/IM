<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Alertas - ImpresorasMonitor</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    color:#333;
}

h1{
    margin-bottom:20px;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-bottom:30px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 5px rgba(0,0,0,.10);
    text-align:center;
}

.valor{
    font-size:2rem;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:30px;
}

th{
    background:#1976d2;
    color:white;
    padding:10px;
    text-align:center;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f5f5f5;
}

nav{
    margin-bottom:20px;
}

nav a{
    text-decoration:none;
    color:#1976d2;
    font-weight:bold;
}

</style>

</head>

<body>

<nav>
    <a href="index.html">🏠 Dashboard</a>
</nav>

<h1>🚨 Alertas</h1>

<div class="kpis">

    <div class="card">
        <h3>Críticas</h3>
        <div id="criticas" class="valor">0</div>
    </div>

    <div class="card">
        <h3>Advertencias</h3>
        <div id="advertencias" class="valor">0</div>
    </div>

    <div class="card">
        <h3>Offline</h3>
        <div id="offline" class="valor">0</div>
    </div>

</div>

<h2>🔴 Alertas Críticas</h2>

<table>
<thead>
<tr>
<th>ID</th>
<th>Serie</th>
<th>Equipo</th>
<th>Modelo</th>
<th>Consumible</th>
<th>%</th>
<th>PN</th>
<th>Estado</th>
<th>Fecha</th>
</tr>
</thead>

<tbody id="tablaCriticas"></tbody>
</table>

<h2>🟡 Alertas Advertencia</h2>

<table>
<thead>
<tr>
<th>ID</th>
<th>Serie</th>
<th>Equipo</th>
<th>Modelo</th>
<th>Consumible</th>
<th>%</th>
<th>PN</th>
<th>Estado</th>
<th>Fecha</th>
</tr>
</thead>

<tbody id="tablaAdvertencias"></tbody>
</table>

<h2>⚫ Equipos Offline</h2>

<table>
<thead>
<tr>
<th>Serie</th>
<th>Equipo</th>
<th>Modelo</th>
<th>Estado</th>
<th>Fecha</th>
</tr>
</thead>

<tbody id="tablaOffline"></tbody>
</table>

<script>

fetch("dashboard.json")
.then(r => r.json())
.then(data => {

    console.log(data.alertas);
    console.log("DASHBOARD");
    console.log(data);

    console.log("ALERTAS");
    console.log(data.alertas);

    const tablaCriticas =
        document.getElementById(
            "tablaCriticas"
        );

    const tablaAdvertencias =
        document.getElementById(
            "tablaAdvertencias"
        );

    const tablaOffline =
        document.getElementById(
            "tablaOffline"
        );

    const criticas =
        data.alertas.filter(
            a =>
                a.tipo === "consumible"
                &&
                a.criticidad === "critico"
        );

    const advertencias =
        data.alertas.filter(
            a =>
                a.tipo === "consumible"
                &&
                a.criticidad === "advertencia"
        );

    const offline =
        data.alertas.filter(
            a =>
                a.tipo === "offline"
                &&
                a.estado === "notificado"
        );

    document.getElementById("criticas")
        .innerText =
        criticas.length;

    document.getElementById("advertencias")
        .innerText =
        advertencias.length;

    document.getElementById("offline")
        .innerText =
        offline.length;

    criticas.forEach(a => {

        tablaCriticas.innerHTML += `
        <tr>
            <td>${a.id_alerta}</td>
            <td>${a.serial ?? "-"}</td>
            <td>${a.equipo ?? "-"}</td>
            <td>${a.modelo ?? "-"}</td>
            <td>${a.consumible ?? "-"}</td>
            <td>${a.porcentaje ?? "-"}</td>
            <td>${a.pn ?? "-"}</td>
            <td>${a.estado_texto ?? "-"}</td>
            <td>${a.fecha_notificacion ?? "-"}</td>

            </tr>
        `;

    });

    advertencias.forEach(a => {

        tablaAdvertencias.innerHTML += `
        <tr>
            <td>${a.id_alerta}</td>
            <td>${a.serial ?? "-"}</td>
            <td>${a.equipo ?? "-"}</td>
            <td>${a.modelo ?? "-"}</td>
            <td>${a.consumible ?? "-"}</td>
            <td>${a.porcentaje ?? "-"}</td>
            <td>${a.pn ?? "-"}</td>
            <td>${a.estado_texto ?? "-"}</td>
            <td>${a.fecha_notificacion ?? "-"}</td>
        </tr>
        `;

    });

    offline.forEach(a => {

        tablaOffline.innerHTML += `
        <tr>
            <td>${a.serial ?? "-"}</td>
            <td>${a.equipo ?? "-"}</td>
            <td>${a.modelo ?? "-"}</td>
            <td>${a.estado_texto ?? "-"}</td>
            <td>${a.fecha_notificacion ?? "-"}</td>
        </tr>
        `;

    });

});

</script>

</body>
</html>
